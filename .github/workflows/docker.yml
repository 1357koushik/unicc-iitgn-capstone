# Builds both Docker images and checks them, on every change to what goes into them.
# The retrieval data (8 GB) is not available here, so the retrieval image is checked for its
# packages and for refusing missing data with a clear message; the full run with the data is
# described in docs/DOCKER_SETUP.md, section 8.
name: docker

on:
  push:
    branches: [main]
    paths:
      - deployment/**
      - docker-compose.yml
      - .dockerignore
      - .env.example
      - requirements-*.txt
      - security_platform/**
      - llm/**
      - threat_retrieval_engine/**
      - config/**
      - scripts/docker/**
      - tests/test_retrieval_data_bundle.py
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - deployment/**
      - docker-compose.yml
      - .dockerignore
      - .env.example
      - requirements-*.txt
      - security_platform/**
      - llm/**
      - threat_retrieval_engine/**
      - config/**
      - scripts/docker/**
      - tests/test_retrieval_data_bundle.py
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Settings file as a new installation would have it
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          mkdir -p ci-empty-data

      - name: Compose file is valid
        run: RETRIEVAL_DATA_DIR=./ci-empty-data docker compose config --quiet

      - name: Data bundle tool tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tests/test_retrieval_data_bundle.py

      - name: Build both images
        run: RETRIEVAL_DATA_DIR=./ci-empty-data docker compose build

      - name: Retrieval image - exact packages, CPU-only torch, code imports
        run: |
          docker run --rm --entrypoint python unicc-cyber-ai/retrieval:local -c "
          import torch, sys
          assert torch.__version__.startswith('2.6.0') and '+cpu' in torch.__version__, torch.__version__
          assert sys.version_info[:2] == (3, 12), sys.version
          import threat_retrieval_engine.api.main, threat_retrieval_engine.v2.service
          print('torch', torch.__version__, 'python', sys.version.split()[0])"
          docker run --rm --entrypoint uv unicc-cyber-ai/retrieval:local pip check --system
          docker run --rm --entrypoint id unicc-cyber-ai/retrieval:local -u | grep -qx 10001

      - name: Retrieval container refuses missing data with a clear message
        run: |
          RETRIEVAL_DATA_DIR=./ci-empty-data docker compose up -d retrieval
          for i in $(seq 1 30); do
            docker compose logs retrieval | grep -q "is not usable" && break; sleep 2
          done
          docker compose logs retrieval
          docker compose logs retrieval | grep -q "store is missing"
          RETRIEVAL_DATA_DIR=./ci-empty-data docker compose rm -sf retrieval

      - name: Web app starts healthy, creates the accounts, logs in, shows the Gemini panel
        run: |
          RETRIEVAL_DATA_DIR=./ci-empty-data docker compose up -d --no-deps backend
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backend)")" = healthy ] && break; sleep 3
          done
          docker compose ps
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backend)")" = healthy ]
          docker compose exec -T backend id -u | grep -qx 10001
          PW=$(docker compose logs backend | grep 'username: admin_user' | sed -E 's/.*password: ([^ ]+).*/\1/')
          [ -n "$PW" ]
          curl -sf -c jar -X POST http://127.0.0.1:8080/api/v1/auth/login \
               -H 'Content-Type: application/json' -d "{\"username\": \"admin_user\", \"password\": \"$PW\"}" >/dev/null
          curl -sf -b jar http://127.0.0.1:8080/api/v1/admin/config | tee config.json
          python3 -c "import json; g = json.load(open('config.json'))['gemini']; assert g['key_set'] is False and g['model'], g"
          # Accounts are in the app-data volume: they survive the container being recreated.
          RETRIEVAL_DATA_DIR=./ci-empty-data docker compose up -d --no-deps --force-recreate backend
          sleep 5
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 2; done
          curl -sf -c jar -X POST http://127.0.0.1:8080/api/v1/auth/login \
               -H 'Content-Type: application/json' -d "{\"username\": \"admin_user\", \"password\": \"$PW\"}" >/dev/null

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Clean up
        if: always()
        run: RETRIEVAL_DATA_DIR=./ci-empty-data docker compose down -v
