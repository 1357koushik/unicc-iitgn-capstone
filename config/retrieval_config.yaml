# Retrieval & Storage Configuration (Single Source of Truth, R43)

# Storage paths (anchored to repository root)
qdrant_storage_path: "./data/qdrant_storage"
sqlite_db_path: "./data/sqlite/corpus_store.db"
quarantine_path: "./data/quarantined"

# Qdrant HNSW index settings
hnsw_m: 32
hnsw_ef_construct: 200
hnsw_ef_search: 64

# Qdrant scalar quantization
quantization_type: "Int8"
quantization_quantile: 0.99
quantization_always_ram: true

# MinHash deduplication
minhash_num_permutations: 128
minhash_similarity_threshold: 0.90
minhash_shingle_size: 3

# Ingestion pipeline
pipeline_batch_size: 500
min_text_chars: 15
max_text_chars: 32000
epss_min_score_threshold: 0.5

# ---------------------------------------------------------------------------
# Hybrid retrieval, reranking & graph
# ---------------------------------------------------------------------------

# BM25 lexical index (Okapi)
bm25_k1: 1.5
bm25_b: 0.75
bm25_text_column: "enriched_text"   # "enriched_text" (Strategy-C) or "text"

# Reciprocal Rank Fusion & weighting (alpha)
rrf_k: 60                # RRF smoothing constant
retrieval_candidate_k: 50   # candidates pulled from each retriever before fusion
retrieval_top_k: 10         # fused results returned to the reranker
default_alpha: 0.5

# Cross-encoder reranker
reranker_model: "BAAI/bge-reranker-v2-m3"
reranker_use_fp16: true
reranker_top_k: 5           # final evidence chunks after reranking

# MITRE ATT&CK graph, documents and entity names: C9 build root holding LATEST
# (python -m threat_retrieval_engine.attack.build); TRE_ATTACK_DIR overrides it
attack_build_dir: "./data/attack"

# ---------------------------------------------------------------------------
# Deadlines and Latency Contracts (V2)
# ---------------------------------------------------------------------------
deadlines:
  d_match_seconds: 150.0         # Server-side hard deadline for synchronous /match (PoC excluded)
  t_client_match_seconds: 200.0  # Client timeout for Team 3 investigator (must be > d_match_seconds)
  d_poc_seconds: 200.0           # Deadline for outbound PoC discovery (own deadline, separate from the match deadline)
  client_margin_seconds: 50.0

# ---------------------------------------------------------------------------
# Security & Network Hardening (R36)
# ---------------------------------------------------------------------------
security:
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8000"
    - "http://127.0.0.1:8000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
  service_auth_enabled: false   # false in dev mode, true in production
  api_key_header: "X-API-Key"

# ---------------------------------------------------------------------------
# POC & Exploit Intelligence (Task 4)
# ---------------------------------------------------------------------------
poc_intelligence:
  enabled: true
  cache_ttl_seconds: 21600          # 6 hours default
  kev_cache_ttl_seconds: 3600       # 1 hour for CISA KEV listed vulnerabilities
  max_results_per_source: 100        # cap per individual scraper
  max_total_results: 300             # cap on merged results
  min_confidence_threshold: 0.0     # 0.0 = return all (including SUSPICIOUS with warning flags)
  request_timeout_seconds: 100.0     # per-source async HTTP timeout
  x_allow_paid_requests: false      # R28: default false to protect against unexpected spend
  sources:
    github:
      enabled: true
      token_env_var: "GITHUB_TOKEN"
    x:
      enabled: false
      bearer_token_env_var: "X_BEARER_TOKEN"
    mastodon:
      enabled: true
      instances:
        - "infosec.exchange"
        - "defcon.social"
    bluesky:
      enabled: true
