services:
  retrieval:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.retrieval
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TEAM2_API_URL=http://retrieval:8000
      # Login accounts and the audit log are kept in the project's data/ folder (data/app.db),
      # so they survive "docker compose down" and rebuilds. (Inside the container, the
      # project's data/ folder is /app/data; four slashes = an absolute path.)
      - DATABASE_URL=sqlite:////app/data/app.db
    depends_on:
      - retrieval
    restart: unless-stopped
