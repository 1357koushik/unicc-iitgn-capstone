services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    ports: ["8080:8080"]
    environment:
      - DEFAULT_LLM_BACKEND=ollama
      - OLLAMA_HOST=http://ollama:11434
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=sqlite:////data/app.db
      # Network sensor (Task 5.0): its dataset, trained model and reports, on the app-data volume
      - NETWORK_SENSOR_DATA_DIR=/data/network_sensor
    volumes:
      - app-data:/data
    depends_on: [ollama]

  retrieval:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.retrieval
    ports: ["8000:8000"]
    volumes:
      - retrieval-data:/app/data

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  app-data:
  retrieval-data:
  ollama-models:
