[project]
name = "unicc-team2-retrieval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "FlagEmbedding>=1.2.10",
    "transformers>=4.40.0",
    "qdrant-client>=1.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "datasketch>=1.6.4",
    "ftfy>=6.2.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["threat_retrieval_engine*"]

[tool.setuptools.package-data]
threat_retrieval_engine = ["models/*.json", "benchmarks/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["verify", "tests"]
